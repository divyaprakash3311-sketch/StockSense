<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSense - Login & Authentication</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-8 rounded-2xl shadow-2xl">
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-blue-500 tracking-wide">StockSense</h1>
      <p class="text-slate-400 text-sm mt-1">Smart Inventory Management System</p>
    </div>

    <!-- Alert / Message Banner -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- 1. LOGIN FORM -->
    <form id="loginForm" class="space-y-4">
      <h2 class="text-xl font-semibold text-white mb-2">Sign In</h2>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Email</label>
        <input type="email" id="loginEmail" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
        <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>
      <div class="flex justify-end">
        <button type="button" onclick="showView('forgotView')" class="text-xs text-blue-400 hover:underline">Forgot password?</button>
      </div>
      <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200">Login</button>
      <p class="text-center text-xs text-slate-400 mt-4">
        Don't have an account? 
        <button type="button" onclick="showView('signupView')" class="text-blue-400 hover:underline font-semibold">Sign Up</button>
      </p>
    </form>

    <!-- 2. SIGNUP FORM -->
    <form id="signupForm" class="space-y-4 hidden">
      <h2 class="text-xl font-semibold text-white mb-2">Create Account</h2>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Full Name</label>
        <input type="text" id="regName" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Email</label>
        <input type="email" id="regEmail" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
        <input type="password" id="regPassword" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Role</label>
        <select id="regRole" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
          <option value="Inventory Manager">Inventory Manager</option>
          <option value="Warehouse Staff">Warehouse Staff</option>
        </select>
      </div>
      <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition duration-200">Register</button>
      <p class="text-center text-xs text-slate-400 mt-4">
        Already registered? 
        <button type="button" onclick="showView('loginView')" class="text-blue-400 hover:underline font-semibold">Sign In</button>
      </p>
    </form>

    <!-- 3. OTP PASSWORD RESET FORM -->
    <div id="forgotForm" class="space-y-4 hidden">
      <h2 class="text-xl font-semibold text-white mb-2">Reset Password</h2>
      
      <!-- Step A: Request OTP -->
      <div id="requestOtpBlock" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Registered Email</label>
          <input type="email" id="resetEmail" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="button" onclick="requestOTP()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg">Send OTP</button>
      </div>

      <!-- Step B: Verify OTP & Change Password -->
      <div id="verifyOtpBlock" class="space-y-3 hidden">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">6-Digit OTP</label>
          <input type="text" id="otpCode" maxlength="6" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white tracking-widest text-center text-lg focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">New Password</label>
          <input type="password" id="newPassword" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
        </div>
        <button type="button" onclick="submitNewPassword()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg">Update Password</button>
      </div>

      <div class="text-center pt-2">
        <button type="button" onclick="showView('loginView')" class="text-xs text-slate-400 hover:underline">Back to Login</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000/api/auth';

    function showAlert(msg, isError = false) {
      const box = document.getElementById('alertBox');
      box.className = `mb-4 p-3 rounded-lg text-sm font-medium ${isError ? 'bg-red-900/50 text-red-200 border border-red-700' : 'bg-green-900/50 text-green-200 border border-green-700'}`;
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    function showView(view) {
      document.getElementById('alertBox').classList.add('hidden');
      document.getElementById('loginForm').classList.toggle('hidden', view !== 'loginView');
      document.getElementById('signupForm').classList.toggle('hidden', view !== 'signupView');
      document.getElementById('forgotForm').classList.toggle('hidden', view !== 'forgotView');
    }

    // 1. SIGNUP
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(`${API_BASE}/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            full_name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert('Registration complete! Please log in.');
        setTimeout(() => showView('loginView'), 1200);
      } catch (err) {
        showAlert(err.message, true);
      }
    });

    // 2. LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        // Store Token & User session
        localStorage.setItem('stocksense_token', data.token);
        localStorage.setItem('stocksense_user', JSON.stringify(data.user));

        showAlert('Login Successful! Redirecting...');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } catch (err) {
        showAlert(err.message, true);
      }
    });

    // 3. REQUEST OTP
    async function requestOTP() {
      const email = document.getElementById('resetEmail').value;
      if (!email) return showAlert('Please enter your email', true);
      try {
        const res = await fetch(`${API_BASE}/request-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert(`OTP sent! (Dev OTP: ${data.otpPreview})`);
        document.getElementById('verifyOtpBlock').classList.remove('hidden');
      } catch (err) {
        showAlert(err.message, true);
      }
    }

    // 4. RESET PASSWORD WITH OTP
    async function submitNewPassword() {
      const email = document.getElementById('resetEmail').value;
      const otp = document.getElementById('otpCode').value;
      const newPassword = document.getElementById('newPassword').value;

      try {
        const res = await fetch(`${API_BASE}/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, newPassword })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        showAlert('Password reset successful! Please log in.');
        setTimeout(() => showView('loginView'), 1200);
      } catch (err) {
        showAlert(err.message, true);
      }
    }
  </script>
</body>
</html>
